name: Deploy backend

# Manual only, to save GitHub Actions minutes: Actions tab -> Deploy backend -> Run workflow.
on:
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy to the server after pushing the image (untick to only build and push)
        type: boolean
        default: true

concurrency:
  group: deploy-backend
  cancel-in-progress: false

env:
  IMAGE_NAME: ${{ vars.DOCKERHUB_USERNAME }}/renoviq-backend

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
    env:
      TEST_MONGODB_URI: mongodb://localhost:27017
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.tag.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - name: Work out the image tag
        id: tag
        run: echo "image=${IMAGE_NAME}:${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.tag.outputs.image }}
            ${{ env.IMAGE_NAME }}:latest

  deploy:
    needs: build-and-push
    if: ${{ inputs.deploy }}
    runs-on: ubuntu-latest
    # Optional: add required reviewers to the "production" environment for an approval step.
    environment: production
    env:
      EC2_HOST: ${{ vars.EC2_HOST }}
      EC2_USER: ${{ vars.EC2_USER }}
      IMAGE: ${{ needs.build-and-push.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up SSH
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_KNOWN_HOSTS: ${{ secrets.EC2_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$EC2_KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Copy the deploy files
        run: |
          scp -i ~/.ssh/deploy_key -o BatchMode=yes -o StrictHostKeyChecking=yes \
            deploy/docker-compose.yml deploy/deploy.sh deploy/backup-mongo.sh \
            "$EC2_USER@$EC2_HOST:/opt/renoviq/"
      - name: Log in to Docker Hub on the server
        env:
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          printf '%s' "$DOCKERHUB_TOKEN" | ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "$EC2_USER@$EC2_HOST" "docker login --username '$DOCKERHUB_USERNAME' --password-stdin"
      - name: Deploy and wait for the health check
        run: |
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "$EC2_USER@$EC2_HOST" "chmod +x /opt/renoviq/*.sh && /opt/renoviq/deploy.sh '$IMAGE'"
