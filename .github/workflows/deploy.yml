name: Deploy backend

# Manual only, to save GitHub Actions minutes: Actions tab -> Deploy backend -> Run workflow.
# The first run creates /opt/renoviq on the server. The application settings live in
# /opt/renoviq/.env, which you write by hand on the server; this workflow only checks it exists.
# MongoDB is created on the first run and left alone afterwards, only the API container is replaced.
# nginx is configured by hand on the server and is never touched by this workflow.
on:
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy to the server after pushing the image (untick to only build and push)
        type: boolean
        default: true

concurrency:
  group: deploy-backend
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
    env:
      TEST_MONGODB_URI: mongodb://localhost:27017
    steps:
      - uses: actions/checkout@v4

      # First on purpose: a missing Docker, folder permission or .env value fails here in seconds,
      # before any build time is spent. Third-party actions get the SSH key, so they are pinned to a commit.
      - name: Check the server (Docker, /opt/renoviq, .env)
        if: ${{ inputs.deploy }}
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -eu
            if ! docker compose version > /dev/null 2>&1 || ! docker info > /dev/null 2>&1; then
              echo "Docker Engine with the Compose plugin must be installed and usable by this user (sudo usermod -aG docker $(id -un), then log in again)"
              exit 1
            fi
            if [ ! -w /opt/renoviq ]; then
              sudo -n install -d -o "$(id -un)" -g "$(id -gn)" /opt/renoviq || {
                echo "Cannot create /opt/renoviq: give this user passwordless sudo, or run once: sudo install -d -o $(id -un) /opt/renoviq"
                exit 1
              }
              echo "Created /opt/renoviq"
            fi
            cd /opt/renoviq
            if [ ! -f .env ]; then
              echo "Write /opt/renoviq/.env on the server first (template: deploy/server.env.example in this repository), then run this workflow again."
              exit 1
            fi
            missing=""
            for name in MONGO_USER MONGO_PASSWORD SESSION_SECRET CLIENT_ORIGIN GOOGLE_CLIENT_ID GOOGLE_CLIENT_SECRET \
              GOOGLE_CALLBACK_URL SMTP_HOST SMTP_PORT SMTP_USER SMTP_PASS GEMINI_API_KEY S3_BUCKET AWS_REGION; do
              grep -q "^$name=." .env || missing="$missing $name"
            done
            if [ -n "$missing" ]; then
              echo "/opt/renoviq/.env has no value for:$missing"
              exit 1
            fi
            echo "Server is ready"

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          # DOCKERHUB_TOKEN is the documented name; DOCKERHUB_PASSWORD is accepted too.
          password: ${{ secrets.DOCKERHUB_TOKEN || secrets.DOCKERHUB_PASSWORD }}
      - name: Build the image on the runner and push it to Docker Hub
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/renoviq-backend:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/renoviq-backend:latest

      - name: Copy the compose file to the server
        if: ${{ inputs.deploy }}
        uses: appleboy/scp-action@ff85246acaad7bdce478db94a363cd2bf7c90345 # v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: deploy/docker-compose.yml
          target: /opt/renoviq
          strip_components: 1

      # MongoDB: created on the first run, then left alone (--no-recreate). Only the API container is replaced.
      - name: Log in to Docker Hub, pull the image and run the container
        id: run
        if: ${{ inputs.deploy }}
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN || secrets.DOCKERHUB_PASSWORD }}
          SHA: ${{ github.sha }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: DOCKERHUB_USERNAME,DOCKERHUB_TOKEN,SHA
          script: |
            set -eu
            cd /opt/renoviq
            # Older versions of this workflow kept the whole image name in .current-image.
            if [ ! -s .last_good_image ] && [ -s .current-image ]; then sed 's/.*://' .current-image > .last_good_image; fi
            printf '%s' "$DOCKERHUB_TOKEN" | docker login --username "$DOCKERHUB_USERNAME" --password-stdin
            export IMAGE="$DOCKERHUB_USERNAME/renoviq-backend:$SHA"
            docker compose up -d --no-recreate --wait mongo
            docker compose pull api
            docker compose up -d --no-deps --wait --wait-timeout 90 api
            # It is healthy: it is now the last good version. Prune removes every image no container uses,
            # so only this one (and MongoDB) stays on the server.
            echo "$SHA" > .last_good_image
            rm -f .current-image
            docker image prune -af > /dev/null

      # The app is already running at this point; this tells you early if photos cannot be saved.
      - name: Check that the API container can reach the S3 bucket
        if: ${{ inputs.deploy }}
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -eu
            cd /opt/renoviq
            docker compose exec -T api node -e "
              import('@aws-sdk/client-s3').then(async ({ S3Client, HeadBucketCommand }) => {
                await new S3Client({}).send(new HeadBucketCommand({ Bucket: process.env.S3_BUCKET }));
                console.log('S3 bucket ' + process.env.S3_BUCKET + ' is reachable');
              }).catch((e) => {
                console.error('S3 check failed: ' + e.name + ' (HTTP ' + ((e.\$metadata && e.\$metadata.httpStatusCode) || 'none') + '): ' + e.message);
                console.error('Check S3_BUCKET and AWS_REGION in /opt/renoviq/.env, the IAM role on the instance and its metadata hop limit (docs/deployment.md).');
                process.exit(1);
              });"

      # /opt/renoviq/.last_good_image holds the commit SHA of the last version that passed its health
      # check. Only that image is kept on the server, so it is what a failed deploy rolls back to.
      - name: Roll back to the last good image
        if: ${{ failure() && steps.run.outcome == 'failure' }}
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: DOCKERHUB_USERNAME
          script: |
            cd /opt/renoviq
            docker compose logs --tail 40 api
            if [ -s .last_good_image ]; then
              export IMAGE="$DOCKERHUB_USERNAME/renoviq-backend:$(cat .last_good_image)"
              echo "Rolling back to $IMAGE"
              docker compose up -d --no-deps --wait api
              # The failed image is not used by any container now, so prune removes it.
              docker image prune -af > /dev/null
            fi
