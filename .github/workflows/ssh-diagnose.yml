name: SSH diagnose (temporary)

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Host key fingerprints the server presents
        id: fp
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_FINGERPRINT: ${{ secrets.EC2_FINGERPRINT }}
        run: |
          for t in ed25519 ecdsa rsa; do
            fp="$(ssh-keyscan -T 10 -t "$t" "$EC2_HOST" 2> /dev/null | ssh-keygen -lf - 2> /dev/null | awk '{print $2}')"
            echo "$t=$fp" >> "$GITHUB_OUTPUT"
            echo "$t: ${fp:-not offered}"
            if [ -n "$fp" ] && [ "$fp" = "$EC2_FINGERPRINT" ]; then echo "  -> the EC2_FINGERPRINT secret equals this one"; fi
          done
          echo "secret length: ${#EC2_FINGERPRINT}; starts with SHA256: $([[ $EC2_FINGERPRINT == SHA256:* ]] && echo yes || echo no)"

      - name: Action with the ed25519 fingerprint
        id: ed25519
        if: ${{ steps.fp.outputs.ed25519 != '' }}
        continue-on-error: true
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          fingerprint: ${{ steps.fp.outputs.ed25519 }}
          script: echo "connected as $(whoami)"

      - name: Action with the ecdsa fingerprint
        id: ecdsa
        if: ${{ steps.fp.outputs.ecdsa != '' }}
        continue-on-error: true
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          fingerprint: ${{ steps.fp.outputs.ecdsa }}
          script: echo "connected as $(whoami)"

      - name: Action with the rsa fingerprint
        id: rsa
        if: ${{ steps.fp.outputs.rsa != '' }}
        continue-on-error: true
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          fingerprint: ${{ steps.fp.outputs.rsa }}
          script: echo "connected as $(whoami)"

      - name: Result
        run: |
          echo "ed25519: ${{ steps.ed25519.outcome }}"
          echo "ecdsa:   ${{ steps.ecdsa.outcome }}"
          echo "rsa:     ${{ steps.rsa.outcome }}"
