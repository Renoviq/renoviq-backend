# Runs on the server in /opt/renoviq (copied there by the deploy workflow).
# /opt/renoviq/.env is written by the workflow from the GitHub secrets (deploy/render-env.sh).
services:
  api:
    image: ${IMAGE:-renoviq-backend:unset}
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: "3000"
    # Only nginx on this machine can reach the API.
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      mongo:
        condition: service_healthy

  # Created on the first deploy and then left alone: deploy.sh never recreates or restarts it,
  # so the data volume and the credentials stay as they were on the first run.
  mongo:
    image: mongo:7
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
    # No published port: only the api container can reach the database.
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet -u \"$$MONGO_INITDB_ROOT_USERNAME\" -p \"$$MONGO_INITDB_ROOT_PASSWORD\" --authenticationDatabase admin --eval 'db.adminCommand({ping:1}).ok' | grep -q 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

volumes:
  mongo-data:
