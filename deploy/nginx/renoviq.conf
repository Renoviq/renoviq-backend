# nginx site for Renoviq on the EC2 server.
#   - serves the web app (renoviq-frontend build) from /var/www/renoviq/current
#   - proxies /api and /auth to the backend container on 127.0.0.1:3000
#
# One-time setup (Ubuntu):
#   sudo cp renoviq.conf /etc/nginx/sites-available/renoviq.conf
#   sudo sed -i 's/renoviq.example.com/YOUR.DOMAIN/' /etc/nginx/sites-available/renoviq.conf
#   sudo ln -s /etc/nginx/sites-available/renoviq.conf /etc/nginx/sites-enabled/renoviq.conf
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d YOUR.DOMAIN      # adds the HTTPS server block and the http -> https redirect

# At most 10 requests a minute per IP (plus a burst of 10) on sign-in, sign-up and code endpoints.
limit_req_zone $binary_remote_addr zone=renoviq_auth:10m rate=10r/m;

upstream renoviq_api {
    server 127.0.0.1:3000;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name renoviq.example.com;

    root /var/www/renoviq/current;
    index index.html;

    # Room photos (5 MB at most) are uploaded to the API, so this is a little above that.
    client_max_body_size 6m;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Creating a design waits for the AI (up to about 90 seconds), so the read timeout is longer.
    location /api/ {
        proxy_pass http://renoviq_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    location ~ ^/api/(login|register|verify-otp|resend-otp)$ {
        limit_req zone=renoviq_auth burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://renoviq_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Google sign-in start and callback
    location /auth/ {
        proxy_pass http://renoviq_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Vite puts a hash in these file names, so they can be cached for a year.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # index.html changes with every release and must not be cached.
    location = /index.html {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Single-page app: unknown paths load index.html and the router takes over.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
